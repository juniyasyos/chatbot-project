name: Pull Request Validation and Prometheus Validation

on:
  pull_request:
    branches:
      - main
  
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.11.1"

      - name: Install dependencies
        run: npm install

      - name: Lint the code
        run: npm run lint
        continue-on-error: false

      - name: Run tests
        run: npm run test -- --watch=false

      - name: Build the application
        run: npm run build